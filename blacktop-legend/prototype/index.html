<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blacktop Legend</title>
<style>
  /* Night-court arcade: single committed theme, every surface painted explicitly */
  :root{
    --asphalt:#10151b;      /* page ground */
    --panel:#1b232d;        /* HUD / overlay panels */
    --panel-2:#242f3b;      /* raised elements */
    --line:#33414f;
    --chalk:#f2ecdd;        /* warm chalk-white ink */
    --chalk-dim:#a8b0ac;
    --lamp:#ffb347;         /* streetlight amber accent */
    --you:#4fd1c5;          /* your teal */
    --them:#ff7a6b;         /* opponent red */
    --flow:#7db8ff;         /* flow-state blue */
    --good:#7bd88f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--asphalt); color:var(--chalk);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
  #stage{position:relative;background:#000;border-bottom:2px solid var(--line)}
  #cv{display:block;width:100%;aspect-ratio:10/9;background:#68b06a}
  #hud{position:absolute;top:6px;left:6px;background:rgba(16,21,27,.82);border:1px solid var(--line);
       border-radius:6px;padding:4px 8px;font-size:11px;line-height:1.5;color:var(--chalk)}
  #hud b{color:var(--lamp)}
  #menuBtn{position:absolute;top:6px;right:6px;background:var(--panel);color:var(--chalk);
       border:1px solid var(--line);border-radius:6px;font-size:16px;padding:4px 10px}
  #toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:var(--panel-2);
       border:1px solid var(--lamp);color:var(--chalk);border-radius:8px;padding:8px 14px;font-size:12px;
       white-space:nowrap;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #dlg{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(16,21,27,.94);
       border:2px solid var(--lamp);border-radius:8px;padding:10px 12px;min-height:64px;font-size:13px;
       line-height:1.5;z-index:20;color:var(--chalk)}
  #dlg .who{color:var(--lamp);font-weight:700}
  #dlg .nxt{position:absolute;right:10px;bottom:4px;color:var(--lamp);animation:bob 0.8s infinite}
  @keyframes bob{50%{transform:translateY(2px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  #pad{flex:1;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;min-height:150px}
  .dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
  .dpad button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--chalk-dim);font-size:20px}
  .dpad button:active{background:var(--panel-2);color:var(--lamp)}
  .dpad .blank{visibility:hidden}
  #btnA{width:74px;height:74px;border-radius:50%;background:var(--lamp);color:#241a08;font-size:22px;
        font-weight:800;border:none;box-shadow:0 3px 0 #8a5f24}
  #btnA:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5f24}
  .hint{text-align:center;color:var(--chalk-dim);font-size:10px;padding-bottom:6px}

  .overlay{position:fixed;inset:0;background:var(--asphalt);z-index:40;display:flex;flex-direction:column;
        max-width:520px;margin:0 auto;overflow-y:auto}
  .hidden{display:none !important}

  /* Battle */
  #bTop{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  #bScore{display:flex;justify-content:space-between;align-items:center;font-size:12px}
  #bScore .num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  #bScore .you .num{color:var(--you)} #bScore .them .num{color:var(--them)}
  #bScore .mid{color:var(--chalk-dim);font-size:10px;text-align:center}
  .bars{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .barrow{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--chalk-dim)}
  .barrow .lbl{width:52px}
  .bar{flex:1;height:8px;background:#0d1117;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
  .sta-you i{background:var(--you)} .sta-them i{background:var(--them)}
  .flowpips{display:flex;gap:3px}
  .flowpips s{width:10px;height:10px;border-radius:2px;background:#0d1117;border:1px solid var(--line);text-decoration:none}
  .flowpips s.on{background:var(--flow);border-color:var(--flow)}
  .inflow{animation:flowpulse 1s infinite}
  @keyframes flowpulse{50%{filter:brightness(1.6)}}
  #bScene{flex:0 0 auto;position:relative;background:#141b26}
  #bcv{display:block;width:100%;aspect-ratio:4/3}
  #bFx{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:16px;color:var(--lamp);
      font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.8);pointer-events:none}
  #bLog{padding:8px 14px;font-size:13px;line-height:1.6;min-height:84px;color:var(--chalk)}
  #bLog .dim{color:var(--chalk-dim)}
  #bActs{margin-top:auto;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
  #bPrompt{font-size:11px;color:var(--lamp);margin-bottom:8px;font-weight:700}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--chalk);
      padding:10px 8px;font-size:12px;text-align:left;line-height:1.35;font-family:inherit}
  .acts button:active{border-color:var(--lamp)}
  .acts button:disabled{opacity:.35}
  .acts .sub{display:block;font-size:9px;color:var(--chalk-dim)}
  .acts .fam-drive{border-left:3px solid var(--you)}
  .acts .fam-jumper{border-left:3px solid var(--lamp)}
  .acts .fam-three{border-left:3px solid var(--flow)}
  .acts .fam-post{border-left:3px solid var(--them)}
  .acts .fam-item{border-left:3px solid var(--good)}
  .acts .fam-def{border-left:3px solid var(--chalk-dim)}

  /* Title */
  #title{justify-content:center;align-items:center;text-align:center;gap:18px;
      background:radial-gradient(ellipse at 50% 30%,#1d2733 0%,var(--asphalt) 70%)}
  #title .ball{font-size:64px}
  #title h1{font-size:34px;letter-spacing:2px;color:var(--lamp);text-transform:uppercase;
      text-shadow:0 4px 0 #5d3c0e;line-height:1.1;text-wrap:balance}
  #title p{color:var(--chalk-dim);font-size:12px;max-width:300px;line-height:1.6}
  #title button{background:var(--lamp);color:#241a08;border:none;border-radius:10px;
      padding:14px 34px;font-size:15px;font-weight:800;font-family:inherit}
  #title .ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
  /* Menu */
  #menu{padding:16px;gap:14px}
  #menu h2{color:var(--lamp);font-size:15px;letter-spacing:1px}
  #menu section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;line-height:1.7}
  #menu .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #menu .chips button{background:var(--panel-2);border:1px solid var(--line);color:var(--chalk-dim);
      border-radius:16px;padding:6px 12px;font-size:11px;font-family:inherit}
  #menu .chips button.eq{border-color:var(--you);color:var(--you);font-weight:700}
  #menu .row{display:flex;gap:8px}
  #menu .row button{flex:1;background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);
      border-radius:8px;padding:12px;font-size:13px;font-family:inherit}
  #menu .danger{color:var(--them) !important}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-variant-numeric:tabular-nums}
</style>

<div id="game">
  <div id="stage">
    <canvas id="cv" width="312" height="216"></canvas>
    <div id="hud"></div>
    <button id="menuBtn">☰</button>
    <div id="dlg" class="hidden"><div id="dlgText"></div><div class="nxt">▼</div></div>
    <div id="toast" class="hidden"></div>
  </div>
  <div class="hint">Hold D-pad to stroll · Ⓐ to talk / hoop = freestyle · keyboard: arrows + Z</div>
  <div id="pad">
    <div class="dpad">
      <button class="blank"></button><button data-d="up">▲</button><button class="blank"></button>
      <button data-d="left">◀</button><button class="blank"></button><button data-d="right">▶</button>
      <button class="blank"></button><button data-d="down">▼</button><button class="blank"></button>
    </div>
    <button id="btnA">A</button>
  </div>
</div>

<div id="battle" class="overlay hidden">
  <div id="bTop">
    <div id="bScore">
      <div class="you"><div id="bYouName">YOU</div><div class="num" id="bYouPts">0</div></div>
      <div class="mid" id="bMid">FIRST TO 11<br>2s &amp; 3s</div>
      <div class="them" style="text-align:right"><div id="bThemName">THEM</div><div class="num" id="bThemPts">0</div></div>
    </div>
    <div class="bars">
      <div class="barrow"><span class="lbl">STAMINA</span><div class="bar sta-you"><i id="bYouSta"></i></div>
        <div class="flowpips" id="bYouFlow"></div></div>
      <div class="barrow"><span class="lbl" id="bThemLbl">THEM</span><div class="bar sta-them"><i id="bThemSta"></i></div>
        <div class="flowpips" id="bThemFlow"></div></div>
    </div>
  </div>
  <div id="bScene"><canvas id="bcv"></canvas><div id="bFx"></div></div>
  <div id="bLog"></div>
  <div id="bActs"><div id="bPrompt"></div><div class="acts" id="bBtns"></div></div>
</div>

<div id="title" class="overlay">
  <div class="ball">🏀</div>
  <h1>Blacktop<br>Legend</h1>
  <p>Collect skills. Battle 1v1. Find your Flow.<br>Every court has a King — take the crown, then take The Big Stage.</p>
  <button id="btnNew">New Game</button>
  <button id="btnCont" class="ghost hidden">Continue</button>
  <p style="font-size:10px">M0 prototype · Chapter 1: Your Block</p>
</div>

<div id="menu" class="overlay hidden"></div>

<script>
"use strict";
/* ================= DATA ================= */
const TILE=24, VW=13, VH=9, MW=30, MH=20;
const MAP=[
"##############################",
"#T..T....,....T.....WWWWWWWWW#",
"#.HHHH..............WgggggggW#",
"#.HHHH..............WggggghgW#",
"#.HHDH..............WgggggggW#",
"#...================GgggggggW#",
"#...=...............WgggggggW#",
"#...=...............WWWWWWWWW#",
"#...=......TT........T.......#",
"#...=.....cccchcccc..........#",
"#...=.....ccccccccc..........#",
"#...=.....ccccccccc.....F....#",
"#...=.....ccccccccc..........#",
"#...=.....cccchcccc..........#",
"#...=...................T....#",
"#...=..........,.............#",
"#......T................T....#",
"#..,.........T..........,....#",
"#T...,.......,.........T.....#",
"##############################"];
const SOLID="#TWHDhF", LOCKED_GATE="G";

const SKILLS={
 driveLayup:{name:"Drive Layup",fam:"drive",pts:2,base:62,stat:"fin",sta:8,desc:"Reliable rim attack"},
 pullup:{name:"Pull-Up Jumper",fam:"jumper",pts:2,base:52,stat:"sht",sta:7,desc:"Mid-range stop &amp; pop"},
 crossover:{name:"Killer Crossover",fam:"drive",pts:2,base:56,stat:"hnd",sta:10,desc:"Shake em, attack the lane"},
 floater:{name:"Floater",fam:"drive",pts:2,base:54,stat:"fin",sta:8,ignoreJump:true,desc:"Soft touch, can't be blocked"},
 stepback3:{name:"Stepback Three",fam:"three",pts:3,base:42,stat:"sht",sta:12,desc:"Create space, let it fly"},
 deep3:{name:"Deep Three",fam:"three",pts:3,base:38,stat:"sht",sta:11,desc:"From the parking lot"},
 postFade:{name:"Post Fade",fam:"post",pts:2,base:52,stat:"fin",sta:10,desc:"Back em down, fade away"},
 postHook:{name:"Baby Hook",fam:"post",pts:2,base:55,stat:"fin",sta:9,desc:"Old-school automatic"}
};
const MATCHUP={drive:{tight:10,sag:-14,reach:6,jump:-16},jumper:{tight:-14,sag:4,reach:10,jump:2},
 three:{tight:-12,sag:10,reach:10,jump:8},post:{tight:0,sag:0,reach:8,jump:-14}};
const DEFENSE={tight:{name:"Tight D",hint:"smother jumpers · beat by drives"},
 sag:{name:"Sag Off",hint:"wall off drives · gives up threes"},
 reach:{name:"Reach",hint:"gamble for the steal · risky"},
 jump:{name:"Jump",hint:"hunt blocks inside · beat by 3s"}};
const ITEMS={waterBottle:{name:"Water Bottle",icon:"🧴",desc:"Restore 45 stamina"},
 specialSauce:{name:"Special Sauce",icon:"🌶️",desc:"Next 3 shots +18%"}};

const BALLERS={
 jaylen:{name:'Jaylen "Quicks"',emoji:"⛹🏾",x:9,y:10,stats:{hnd:58,sht:44,fin:52,def:45,stamMax:90},
  loadout:["crossover","driveLayup","pullup"],teaches:"crossover",hasFlow:false,
  intro:["Jaylen: You the kid from the corner house?","Jaylen: Court fee is one L. Check up."],
  win:"Jaylen: Aight, aight. You got some game. Take my crossover — use it right.",
  lose:"Jaylen: Come back when them handles are real."},
 maya:{name:'Maya "Splash"',emoji:"🧕🏽",x:13,y:14,stats:{hnd:46,sht:62,fin:44,def:48,stamMax:95},
  loadout:["stepback3","pullup","deep3"],teaches:"deep3",reward:"waterBottle",hasFlow:false,
  intro:["Maya: I don't shoot 2s unless I'm bored.","Maya: Hope you brought a raincoat. ☔"],
  win:"Maya: Ugh. Fine. Here's my Deep Three — and a water bottle, you look tired.",
  lose:"Maya: Splash. Every. Time."},
 percy:{name:'Old Head Percy',emoji:"🧔🏾",x:19,y:12,stats:{hnd:40,sht:50,fin:60,def:56,stamMax:110},
  loadout:["postFade","postHook","driveLayup"],teaches:"postFade",hasFlow:false,
  intro:["Percy: Young fella. Basketball is chess, not checkers.","Percy: Lesson one is free. The rest cost buckets."],
  win:"Percy: Hm. The student scores. Take the Post Fade — footwork is forever.",
  lose:"Percy: Class dismissed."},
 reign:{name:'KING REIGN 👑',emoji:"🤴🏾",x:24,y:4,stats:{hnd:62,sht:60,fin:62,def:60,stamMax:120},
  loadout:["crossover","stepback3","postFade","driveLayup"],hasFlow:true,reward:"dufflebag",
  intro:["Reign: So you beat the park. Cute.","Reign: This gym is MY kingdom.","Reign: Crown's right here. Come take it."],
  win:"Reign: ...The crown is yours, rook. Take my Dufflebag too — you'll need it where you're going.",
  lose:"Reign: Long live the King."}
};
const PICKUPS=[
 {id:"cap_stepback3",x:2,y:16,icon:"💿",kind:"skill",skill:"stepback3"},
 {id:"cap_floater",x:26,y:17,icon:"💿",kind:"skill",skill:"floater"},
 {id:"item_sauce",x:23,y:8,icon:"🌶️",kind:"item",item:"specialSauce"}];

/* ================= STATE ================= */
const SAVE_KEY="blacktop-save-v1";
let G=null;
function freshGame(){return{
 x:4,y:5,face:"down",dogX:4,dogY:6,
 stats:{hnd:52,sht:48,fin:52,def:46,stamMax:100},sta:100,
 skills:["driveLayup","pullup"],loadout:["driveLayup","pullup"],
 bag:["waterBottle"],bagCap:3,duffle:false,sauce:0,
 beaten:{},picked:{},wins:0,kingDown:false,freestyleBest:0,sauceEarned:false};}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=()=>Math.random();
let audioCtx=null;
function beep(freq,dur,type){try{
 if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type||"square";o.frequency.value=freq;g.gain.value=0.04;
 o.connect(g);g.connect(audioCtx.destination);o.start();
 g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
}catch(e){}}
const sfx={blip:()=>beep(520,.06),make:()=>{beep(660,.09);setTimeout(()=>beep(990,.12),90);},
 miss:()=>beep(180,.15,"sawtooth"),steal:()=>beep(300,.1,"sawtooth"),
 flow:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.12,"triangle"),i*100));}};
function toast(msg,ms){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");
 clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),ms||2200);}

/* ================= SCENES ================= */
let scene="title"; // title | world | dialog | battle | menu

/* ================= DIALOG ================= */
let dlgLines=[],dlgDone=null;
function showDialog(lines,done){scene="dialog";dlgLines=lines.slice();dlgDone=done||null;$("dlg").classList.remove("hidden");nextDialog(true);}
function nextDialog(first){if(!first)sfx.blip();
 if(!dlgLines.length){$("dlg").classList.add("hidden");scene="world";const cb=dlgDone;dlgDone=null;if(cb)cb();return;}
 $("dlgText").textContent=dlgLines.shift();}

/* ================= WORLD (smooth scroll) ================= */
const cv=$("cv"),cx=cv.getContext("2d");
let CW=390,CH=260,T=34;
function resize(){const w=cv.clientWidth;if(!w)return;const h=w*0.9,dpr=window.devicePixelRatio||1;
 CW=w;CH=h;T=w/11.5;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener("resize",resize);
function tileAt(x,y){if(x<0||y<0||x>=MW||y>=MH)return "#";return MAP[y][x];}
function gateOpen(){return G.wins>=3;}
function isSolid(x,y){const t=tileAt(x,y);
 if(t==="G")return !gateOpen();
 if(SOLID.includes(t))return true;
 for(const k in BALLERS){const b=BALLERS[k];if(b.x===x&&b.y===y)return true;}
 for(const p of PICKUPS){if(!G.picked[p.id]&&p.x===x&&p.y===y)return true;}
 return false;}
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let held=null;
const P={x:4.5,y:5.5};const trail=[];
function boxSolid(x,y){const r=0.3;
 return isSolid(Math.floor(x-r),Math.floor(y-r))||isSolid(Math.floor(x+r),Math.floor(y-r))||
        isSolid(Math.floor(x-r),Math.floor(y+r))||isSolid(Math.floor(x+r),Math.floor(y+r));}
function step(dt){if(scene!=="world")return;
 if(held){G.face=held;const [dx,dy]=DIRS[held],sp=4.3;
  const nx=P.x+dx*sp*dt;if(!boxSolid(nx,P.y))P.x=nx;
  const ny=P.y+dy*sp*dt;if(!boxSolid(P.x,ny))P.y=ny;
  trail.push({x:P.x,y:P.y});if(trail.length>26)trail.shift();}
 G.x=Math.floor(P.x);G.y=Math.floor(P.y);
 checkTriggers();}
function frontPoint(){const [dx,dy]=DIRS[G.face];return [P.x+dx*0.85,P.y+dy*0.85];}

function interact(){if(scene==="dialog"){nextDialog();return;}
 if(scene!=="world")return;
 const [fx,fy]=frontPoint(),t=tileAt(Math.floor(fx),Math.floor(fy));
 const near=(x,y,r)=>Math.hypot(x+0.5-P.x,y+0.5-P.y)<r||Math.hypot(x+0.5-fx,y+0.5-fy)<0.8;
 for(const k in BALLERS){const b=BALLERS[k];if(near(b.x,b.y,1.15)){talkBaller(k);return;}}
 for(const p of PICKUPS){if(!G.picked[p.id]&&near(p.x,p.y,1.0)){takePickup(p);return;}}
 if(t==="D"){showDialog(["You step inside your crib. Bounce curls up by the door.","You rest up... Stamina fully restored! 💤"],()=>{G.sta=G.stats.stamMax;save();});return;}
 if(t==="F"){let msg=["You splash your face at the fountain. Stamina restored!"];
   if(!G.bag.includes("waterBottle")&&G.bag.length<bagCap()){G.bag.push("waterBottle");msg.push("You filled a Water Bottle. 🧴");}
   showDialog(msg,()=>{G.sta=G.stats.stamMax;save();});return;}
 if(t==="h"){showDialog(["The rim rattles in the night breeze.","Freestyle session? Chain moves, build style. (Costs stamina!)"],()=>startFreestyle());return;}
 if(t==="G"&&!gateOpen()){showDialog(["The gym gate is chained. A sign reads:","\"NOBODY sees King Reign until they've beaten the park.\"","("+G.wins+"/3 park ballers beaten)"]);return;}
}
function bagCap(){return G.duffle?6:3;}
function takePickup(p){G.picked[p.id]=true;sfx.make();
 if(p.kind==="skill"){G.skills.push(p.skill);
  showDialog(["You found a skill capsule! 💿","Learned: "+SKILLS[p.skill].name+" — "+SKILLS[p.skill].desc+".","(Equip it from the ☰ menu — max 4 equipped.)"],()=>{autoEquip(p.skill);save();});}
 else{if(G.bag.length<bagCap()){G.bag.push(p.item);
  showDialog(["You found "+ITEMS[p.item].name+"! "+ITEMS[p.item].icon,ITEMS[p.item].desc+"."],()=>save());}
  else{G.picked[p.id]=false;showDialog(["Your "+(G.duffle?"dufflebag":"backpack")+" is full!"]);}}}
function autoEquip(s){if(G.loadout.length<4&&!G.loadout.includes(s))G.loadout.push(s);}
function talkBaller(k){const b=BALLERS[k];

 if(tag){cx.font=(T*0.42)+"px serif";cx.fillText("❗",X+s*0.5,Y-s*0.75);}};}

 cx.fillStyle="#3e8a4f";cx.beginPath();cx.arc(X,Y-T*0.12,T*(0.46+r*0.12),0,7);cx.fill();
 cx.fillStyle="#54a763";cx.beginPath();cx.arc(X-T*0.18,Y-T*0.32,T*0.32,0,7);cx.arc(X+T*0.2,Y-T*0.24,T*0.28,0,7);cx.fill();};}

 cx.fillStyle="#a94a43";cx.beginPath();cx.moveTo(X-T*0.3,Y+T*0.82);cx.lineTo(X+w/2,Y-T*0.35);cx.lineTo(X+w/2,Y+T*0.06);cx.lineTo(X+T*0.1,Y+T*0.82);cx.closePath();cx.fill();

 cx.fillRect(X+w-T*1.17,Y+T*1.2,T*0.72,T*0.58);cx.strokeRect(X+w-T*1.17,Y+T*1.2,T*0.72,T*0.58);
 cx.fillStyle="#8a5a3a";cx.fillRect(sx(4)+T*0.14,sy(4)+T*0.02,T*0.72,T*0.98);

function drawCourtLines(sx,sy){
 const L=sx(10),Tp=sy(9),R=sx(19),B=sy(14);
 if(R<0||B<0||L>CW||Tp>CH)return;
 cx.save();cx.beginPath();cx.rect(L,Tp,R-L,B-Tp);cx.clip();
 const mid=(Tp+B)/2,cm=(L+R)/2;

 cx.fillRect(cm-T*1.1,Tp+3,T*2.2,T*1.35);cx.fillRect(cm-T*1.1,B-3-T*1.35,T*2.2,T*1.35);
 cx.strokeStyle="rgba(242,236,221,.85)";cx.lineWidth=2;

 cx.beginPath();cx.moveTo(L+3,mid);cx.lineTo(R-3,mid);cx.stroke();
 cx.beginPath();cx.arc(cm,mid,T*0.8,0,7);cx.stroke();
 cx.beginPath();cx.arc(cm,Tp+3,T*2.2,0,Math.PI);cx.stroke();
 cx.beginPath();cx.arc(cm,B-3,T*2.2,Math.PI,Math.PI*2);cx.stroke();

function drawGlow(){
 cx.save();cx.globalCompositeOperation="lighter";
 for(const [lx,ly] of [[9.6,7.6],[19.4,12.7]]){
  const X=(lx-camX)*T,Y=(ly-camY)*T,g=cx.createRadialGradient(X,Y,0,X,Y,T*3);
  g.addColorStop(0,"rgba(255,205,115,.2)");g.addColorStop(1,"rgba(255,205,115,0)");
  cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,T*3,0,7);cx.fill();}
 cx.restore();
 const v=cx.createRadialGradient(CW/2,CH/2,CH*0.5,CW/2,CH/2,CH*1.02);
 v.addColorStop(0,"rgba(25,30,48,0)");v.addColorStop(1,"rgba(25,30,48,.3)");
 cx.fillStyle=v;cx.fillRect(0,0,CW,CH);}
function draw(now){requestAnimationFrame(draw);
 const dt=Math.min(0.05,(now-lastFrame)/1000||0);lastFrame=now;
 if(scene==="battle"){drawBattle(now,dt);return;}
 if(scene==="menu"||scene==="title")return;
 if(cv.clientWidth&&Math.abs(cv.width-cv.clientWidth*(window.devicePixelRatio||1))>1)resize();
 step(dt);
 const VWf=CW/T,VHf=CH/T;
 const wantX=clamp(P.x-VWf/2,0,MW-VWf),wantY=clamp(P.y-VHf/2,0,MH-VHf);
 if(!camSet){camX=wantX;camY=wantY;camSet=true;}
 camX+=(wantX-camX)*Math.min(1,dt*6);camY+=(wantY-camY)*Math.min(1,dt*6);
 const sx=x=>(x-camX)*T,sy=y=>(y-camY)*T;
 cx.fillStyle="#68b06a";cx.fillRect(0,0,CW,CH);
 const x0=Math.max(0,Math.floor(camX)),y0=Math.max(0,Math.floor(camY));
 const x1=Math.min(MW-1,Math.ceil(camX+VWf)),y1=Math.min(MH-1,Math.ceil(camY+VHf));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const t=tileAt(x,y),X=sx(x),Y=sy(y),h=hash(x,y);
  switch(t){
   case ".":case "T":case "F":case ",":
    cx.fillStyle=h<0.5?"#6db56f":"#68b06a";cx.fillRect(X,Y,T+1,T+1);
    if(t===","){cx.fillStyle="#5da261";cx.beginPath();cx.arc(X+T*0.5,Y+T*0.55,T*0.33,0,7);cx.fill();
     cx.fillStyle="#4f9355";cx.beginPath();cx.arc(X+T*0.32,Y+T*0.62,T*0.2,0,7);cx.fill();}
    else if(h>0.84){cx.fillStyle="#5da261";cx.fillRect(X+T*0.2,Y+T*0.35,T*0.09,T*0.28);cx.fillRect(X+T*0.62,Y+T*0.52,T*0.09,T*0.28);}
    else if(h<0.055){cx.fillStyle=h<0.028?"#f2d8e8":"#f6efc9";cx.beginPath();cx.arc(X+T*0.5,Y+T*0.5,T*0.09,0,7);cx.fill();}
    break;
   case "=":
    cx.fillStyle="#e0b57e";cx.fillRect(X,Y,T+1,T+1);
    if(h>0.74){cx.fillStyle="#cda069";cx.beginPath();cx.arc(X+T*(0.25+h*0.5),Y+T*0.55,T*0.08,0,7);cx.fill();}
    break;
   case "c":case "h":
    cx.fillStyle="#4b7290";cx.fillRect(X,Y,T+1,T+1);break;
   case "g":case "G":
    cx.fillStyle=((x+y)%2?"#d3a05e":"#cd9955");cx.fillRect(X,Y,T+1,T+1);
    cx.strokeStyle="rgba(120,72,30,.22)";cx.lineWidth=1;
    cx.beginPath();cx.moveTo(X,Y+T);cx.lineTo(X+T,Y+T);cx.stroke();break;
   case "W":
    cx.fillStyle="#49556a";cx.fillRect(X,Y,T+1,T+1);
    cx.fillStyle="#5b6a84";cx.fillRect(X,Y,T+1,T*0.28);break;
   case "#":
    cx.fillStyle="#2f5b3c";cx.fillRect(X,Y,T+1,T+1);
    cx.fillStyle="#376a46";cx.fillRect(X,Y,T+1,T*0.3);break;
   case "H":case "D":
    cx.fillStyle="#d9c9a8";cx.fillRect(X,Y,T+1,T+1);break;
  }}
 drawCourtLines(sx,sy);
 if(!gateOpen())drawGate(sx,sy);
 const ents=[{y:5.0,f:()=>drawHouse(sx,sy)},{y:12.0,f:()=>drawFountain(sx,sy)},
  {y:9.45,f:drawHoop(sx,sy,14.5,9.35)},{y:13.75,f:drawHoop(sx,sy,14.5,13.65)},
  {y:8.8,f:drawLamp(sx,sy,9.6,8.8)},{y:13.9,f:drawLamp(sx,sy,19.4,13.9)}];
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(tileAt(x,y)==="T")ents.push({y:y+0.95,f:drawTree(sx,sy,x,y)});}
 for(const k in BALLERS){const b=BALLERS[k];ents.push({y:b.y+0.5,f:emojiEnt(sx,sy,b.x+0.5,b.y+0.5,b.emoji,!G.beaten[k])});}

 ents.sort((a,b)=>a.y-b.y);for(const e of ents)e.f();

}

/* ================= BATTLE SCENE RENDERER ================= */
const bcv=$("bcv"),bx=bcv.getContext("2d");
let BW=400,BH=225;
function bResize(){const w=bcv.clientWidth;if(!w)return;const h=w*0.75,dpr=window.devicePixelRatio||1;
 BW=w;BH=h;bcv.width=Math.round(w*dpr);bcv.height=Math.round(h*dpr);bx.setTransform(dpr,0,0,dpr,0,0);}
const RIM={x:0.795,y:0.40};
const A={you:{x:.24,y:.72,jy:0,rot:0,emoji:"⛹🏾",hidden:false},
         foe:{x:.52,y:.66,jy:0,rot:0,emoji:"🧍🏽",hidden:false}};
const Ball={x:.3,y:.7,visible:false};
let bParts=[],bTws=[],bFls=[];
function battleSceneInit(foeEmoji){
 Object.assign(A.you,{x:.24,y:.72,jy:0,rot:0});
 Object.assign(A.foe,{x:.52,y:.66,jy:0,rot:0,hidden:!foeEmoji,emoji:foeEmoji||"🧍🏽"});
 Ball.visible=false;bParts=[];bTws=[];bFls=[];bResize();}
function tw(o,to,ms){return new Promise(res=>{const from={};for(const k in to)from[k]=o[k];
 bTws.push({o,from,to,t0:performance.now(),ms,res});});}
function flight(from,to,ms,h){Ball.visible=true;Ball.x=from.x;Ball.y=from.y;
 return new Promise(res=>{bFls.push({from:{x:from.x,y:from.y},to:{x:to.x,y:to.y},t0:performance.now(),ms,h,res});});}
function burst(x,y,c,n){for(let i=0;i<(n||12);i++)bParts.push({x,y,vx:(rnd()-0.5)*0.35,vy:-rnd()*0.3-0.05,life:0.5+rnd()*0.35,c});}
function drawActor(a,inFlow){if(a.hidden)return;
 const X=a.x*BW,Y=(a.y+a.jy)*BH,s=BW*0.13;
 bx.fillStyle="rgba(0,0,0,.35)";bx.beginPath();bx.ellipse(a.x*BW,a.y*BH+s*0.34,s*0.36,s*0.11,0,0,7);bx.fill();
 if(inFlow){const g=bx.createRadialGradient(X,Y,0,X,Y,s*0.9);
  g.addColorStop(0,"rgba(125,184,255,.4)");g.addColorStop(1,"rgba(125,184,255,0)");
  bx.fillStyle=g;bx.beginPath();bx.arc(X,Y,s*0.9,0,7);bx.fill();}
 bx.save();bx.translate(X,Y);bx.rotate(a.rot*Math.PI/180);
 bx.font=s+"px serif";bx.textAlign="center";bx.textBaseline="middle";bx.fillText(a.emoji,0,0);bx.restore();}
function drawBattle(now,dt){
 if(bcv.clientWidth&&Math.abs(bcv.width-bcv.clientWidth*(window.devicePixelRatio||1))>1)bResize();
 for(let i=bTws.length-1;i>=0;i--){const t=bTws[i],p=clamp((now-t.t0)/t.ms,0,1),e=1-(1-p)*(1-p);
  for(const k in t.to)t.o[k]=t.from[k]+(t.to[k]-t.from[k])*e;
  if(p>=1){bTws.splice(i,1);t.res();}}
 for(let i=bFls.length-1;i>=0;i--){const f=bFls[i],p=clamp((now-f.t0)/f.ms,0,1);
  Ball.x=f.from.x+(f.to.x-f.from.x)*p;
  Ball.y=f.from.y+(f.to.y-f.from.y)*p-f.h*4*p*(1-p);
  if(p>=1){bFls.splice(i,1);f.res();}}
 const W=BW,H=BH,hz=H*0.34;
 // night sky
 let g=bx.createLinearGradient(0,0,0,hz);g.addColorStop(0,"#131a2c");g.addColorStop(1,"#27354e");
 bx.fillStyle=g;bx.fillRect(0,0,W,hz);
 bx.fillStyle="rgba(255,255,255,.7)";
 for(let i=0;i<14;i++){const r=hash(i,7);bx.fillRect(r*W,hash(i,3)*hz*0.8,1.5,1.5);}
 bx.fillStyle="#e8e4d4";bx.beginPath();bx.arc(W*0.12,H*0.12,W*0.025,0,7);bx.fill();
 bx.fillStyle="#27354e";bx.beginPath();bx.arc(W*0.128,H*0.113,W*0.02,0,7);bx.fill();
 // court floor with depth
 g=bx.createLinearGradient(0,hz,0,H);g.addColorStop(0,"#3d5f7b");g.addColorStop(1,"#4b7290");
 bx.fillStyle=g;bx.fillRect(0,hz,W,H-hz);
 // painted key + markings (perspective-ish)
 bx.fillStyle="rgba(232,131,74,.4)";
 bx.beginPath();bx.moveTo(W*0.62,H*0.52);bx.lineTo(W*0.95,H*0.52);bx.lineTo(W*1.0,H*0.78);bx.lineTo(W*0.58,H*0.78);bx.closePath();bx.fill();
 bx.strokeStyle="rgba(242,236,221,.7)";bx.lineWidth=2;
 bx.beginPath();bx.moveTo(0,hz+2);bx.lineTo(W,hz+2);bx.stroke();
 bx.beginPath();bx.ellipse(W*0.80,H*0.65,W*0.34,H*0.26,0,Math.PI*0.55,Math.PI*1.45,true);bx.stroke();
 bx.beginPath();bx.moveTo(W*0.62,H*0.52);bx.lineTo(W*0.95,H*0.52);bx.lineTo(W*1.0,H*0.78);bx.lineTo(W*0.58,H*0.78);bx.closePath();bx.stroke();
 // streetlamp glow
 bx.save();bx.globalCompositeOperation="lighter";
 g=bx.createRadialGradient(W*0.5,hz,0,W*0.5,hz,W*0.45);
 g.addColorStop(0,"rgba(255,205,115,.14)");g.addColorStop(1,"rgba(255,205,115,0)");
 bx.fillStyle=g;bx.fillRect(0,0,W,H);bx.restore();
 // hoop
 const rx=RIM.x*W,ry=RIM.y*H;
 bx.fillStyle="#5b6673";bx.fillRect(W*0.868,ry-H*0.14,W*0.014,H*0.62);
 bx.fillStyle="#f4f6f8";bx.fillRect(W*0.80,ry-H*0.19,W*0.09,H*0.20);
 bx.strokeStyle="#c9d2db";bx.strokeRect(W*0.807,ry-H*0.135,W*0.045,H*0.10);
 bx.strokeStyle="#ff8c42";bx.lineWidth=3;
 bx.beginPath();bx.ellipse(rx,ry,W*0.030,H*0.016,0,0,7);bx.stroke();
 bx.strokeStyle="rgba(255,255,255,.75)";bx.lineWidth=1;
 for(let i=-2;i<=2;i++){bx.beginPath();bx.moveTo(rx+i*W*0.011,ry+H*0.012);bx.lineTo(rx+i*W*0.006,ry+H*0.075);bx.stroke();}
 // particles
 for(let i=bParts.length-1;i>=0;i--){const p=bParts[i];p.life-=dt;
  if(p.life<=0){bParts.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.9*dt;
  bx.globalAlpha=Math.min(1,p.life*2);bx.fillStyle=p.c;
  bx.beginPath();bx.arc(p.x*W,p.y*H,2.2,0,7);bx.fill();bx.globalAlpha=1;}
 // actors (depth order) + ball
 const yFlow=!B.freestyle&&B.youFlowT>0,fFlow=!B.freestyle&&B.foeFlowT>0;
 const list=[[A.you,yFlow],[A.foe,fFlow]].sort((a,b)=>a[0].y-b[0].y);
 for(const [a,fl] of list)drawActor(a,fl);
 if(Ball.visible){const bxp=Ball.x*W,byp=Ball.y*H,r=W*0.018;
  bx.fillStyle="#e8813f";bx.beginPath();bx.arc(bxp,byp,r,0,7);bx.fill();
  bx.strokeStyle="#8a4a1e";bx.lineWidth=1;
  bx.beginPath();bx.arc(bxp,byp,r,0,7);bx.moveTo(bxp-r,byp);bx.quadraticCurveTo(bxp,byp-r*0.6,bxp+r,byp);
  bx.moveTo(bxp,byp-r);bx.quadraticCurveTo(bxp+r*0.6,byp,bxp,byp+r);bx.stroke();}
 // vignette
 const v=bx.createRadialGradient(W/2,H/2,H*0.5,W/2,H/2,H*1.05);
 v.addColorStop(0,"rgba(12,16,28,0)");v.addColorStop(1,"rgba(12,16,28,.42)");
 bx.fillStyle=v;bx.fillRect(0,0,W,H);}
/* battle choreography */
const ATK_HOME={x:.24,y:.72},DEF_HOME={x:.52,y:.66};
function stanceOffense(mine){const atk=mine?A.you:A.foe,dfd=mine?A.foe:A.you;
 tw(atk,{x:ATK_HOME.x,y:ATK_HOME.y,rot:0,jy:0},380);tw(dfd,{x:DEF_HOME.x,y:DEF_HOME.y,rot:0,jy:0},380);}
async function animApproach(atk,fam){
 const spot=fam==="three"?{x:.40,y:.66}:fam==="jumper"?{x:.50,y:.64}:fam==="post"?{x:.58,y:.60}:{x:.62,y:.57};
 await tw(atk,{x:spot.x,y:spot.y},420);}
async function animShot(atk,made,flow){
 tw(atk,{jy:-0.09},220);
 await flight({x:atk.x+0.03,y:atk.y-0.14},RIM,520,0.16);
 tw(atk,{jy:0},220);
 if(made){await flight(RIM,{x:RIM.x+0.005,y:0.56},200,0);Ball.visible=false;
  burst(RIM.x,0.46,flow?"#7db8ff":"#bfe6f7",14);}
 else{await flight(RIM,{x:RIM.x-0.13,y:0.68},330,0.10);Ball.visible=false;
  burst(RIM.x,RIM.y,"#ff8c42",8);}}
async function animSteal(dfd,atk){await tw(dfd,{x:atk.x+0.06,y:atk.y+0.01},220);
 burst(atk.x+0.03,atk.y,"#f4f6f8",10);}
async function animBlock(dfd,atk){tw(atk,{jy:-0.09},200);
 await tw(dfd,{x:atk.x+0.09,jy:-0.12},210);
 await flight({x:atk.x+0.02,y:atk.y-0.14},{x:atk.x+0.13,y:0.72},280,0.04);
 Ball.visible=false;burst(atk.x+0.08,atk.y-0.12,"#f4f6f8",10);
 tw(atk,{jy:0},180);tw(dfd,{jy:0},180);}
async function animAnkle(dfd){await tw(dfd,{rot:82,y:dfd.y+0.035},330);}

/* ================= BATTLE ================= */
const B={};
function pips(el,n){el.innerHTML="";for(let i=0;i<6;i++){const s=document.createElement("s");if(i<n)s.className="on";el.appendChild(s);}}
function startBattle(k){const foe=BALLERS[k];scene="battle";
 Object.assign(B,{foeKey:k,foe:foe,youPts:0,foePts:0,foeSta:foe.stats.stamMax,
  youFlowM:0,foeFlowM:0,youFlowT:0,foeFlowT:0,yourBall:true,lastFam:null,sauceLeft:0,over:false,freestyle:false});
 $("battle").classList.remove("hidden");
 $("bYouName").textContent="YOU";
 $("bThemName").textContent=foe.name;$("bThemLbl").textContent="THEM";
 $("bMid").innerHTML="FIRST TO 11<br>2s &amp; 3s";
 battleSceneInit(foe.emoji);
 logClear();refreshBattleHud();
 logLine("You check the ball up with "+foe.name+".","dim");
 offensePhase();}
function refreshBattleHud(){$("bYouPts").textContent=B.freestyle?B.style:(B.youPts);
 $("bThemPts").textContent=B.freestyle?B.attempts:B.foePts;
 $("bYouSta").style.width=clamp(G.sta/G.stats.stamMax*100,0,100)+"%";
 $("bThemSta").style.width=B.freestyle?"0%":clamp(B.foeSta/B.foe.stats.stamMax*100,0,100)+"%";
 pips($("bYouFlow"),B.freestyle?0:(B.youFlowT>0?6:B.youFlowM));
 pips($("bThemFlow"),B.freestyle?0:(B.foeFlowT>0?6:B.foeFlowM));
 $("bYouFlow").classList.toggle("inflow",!B.freestyle&&B.youFlowT>0);
 $("bThemFlow").classList.toggle("inflow",!B.freestyle&&B.foeFlowT>0);}
function logClear(){$("bLog").innerHTML="";}
function logLine(txt,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent=txt;
 const log=$("bLog");log.appendChild(d);while(log.children.length>4)log.removeChild(log.firstChild);}
function fx(t){$("bFx").textContent=t||"";}
function setActs(prompt,btns){$("bPrompt").textContent=prompt;const wrap=$("bBtns");wrap.innerHTML="";
 for(const b of btns){const el=document.createElement("button");el.className=b.cls||"";
  el.innerHTML=b.html;el.disabled=!!b.disabled;el.onclick=()=>{sfx.blip();b.fn();};wrap.appendChild(el);}}
function clearActs(){$("bPrompt").textContent="";$("bBtns").innerHTML="";}

function skillBtn(id,fn){const s=SKILLS[id];
 return {cls:"fam-"+s.fam,fn:fn,
  html:s.name+" <span class='sub'>"+s.fam.toUpperCase()+" · "+s.pts+" pts · "+s.sta+" sta</span>"};}

function offensePhase(){if(B.over)return;
 // flow trigger
 if(B.youFlowM>=6&&B.youFlowT===0){B.youFlowM=0;B.youFlowT=6;sfx.flow();fx("🌊 FLOW STATE 🌊");
  logLine("Everything slows down. The rim looks like the ocean. YOU CAN'T MISS.");}
 refreshBattleHud();stanceOffense(true);
 const btns=G.loadout.map(id=>skillBtn(id,()=>playerShot(id)));
 if(!B.freestyle&&G.bag.length)btns.push({cls:"fam-item",html:"🎒 Bag <span class='sub'>use an item (takes possession)</span>",fn:openBattleBag});
 setActs(B.youFlowT>0?"YOUR BALL — you're in FLOW":"YOUR BALL — pick your move",btns);}
function openBattleBag(){const btns=G.bag.map((it,i)=>({cls:"fam-item",
  html:ITEMS[it].icon+" "+ITEMS[it].name+" <span class='sub'>"+ITEMS[it].desc+"</span>",fn:()=>useItem(i)}));
 btns.push({cls:"fam-def",html:"↩ Back",fn:offensePhase});
 setActs("BACKPACK",btns);}
async function useItem(i){const it=G.bag.splice(i,1)[0];clearActs();
 if(it==="waterBottle"){G.sta=clamp(G.sta+45,0,G.stats.stamMax);logLine("You chug the Water Bottle. Stamina +45! 🧴");}
 if(it==="specialSauce"){B.sauceLeft=3;logLine("You crack open the Special Sauce. 🌶️ Next 3 shots are SEASONED (+18%).");}
 refreshBattleHud();await sleep(900);
 logLine("You walk it back up top — possession over.","dim");
 await sleep(700);endPossession();}

async function playerShot(id){clearActs();const s=SKILLS[id];
 const scheme=aiDefense();
 G.sta=clamp(G.sta-s.sta,0,G.stats.stamMax);B.lastFam=s.fam;
 await resolveShot({off:"you",skill:s,scheme:scheme});}
function aiDefense(){const f=B.lastFam;
 const counter={drive:(rnd()<.5?"sag":"jump"),jumper:"tight",three:"tight",post:"jump"}[f]||["tight","sag","reach","jump"][Math.floor(rnd()*4)];
 return (f&&rnd()<.55)?counter:["tight","sag","reach","jump"][Math.floor(rnd()*4)];}

async function resolveShot(o){ // o: off "you"|"foe", skill, scheme
 const youOff=o.off==="you";
 const off=youOff?{stats:G.stats,sta:G.sta,flow:B.youFlowT>0}:{stats:B.foe.stats,sta:B.foeSta,flow:B.foeFlowT>0};
 const def=youOff?{stats:B.foe.stats,flow:B.foeFlowT>0}:{stats:G.stats,flow:B.youFlowT>0};
 const s=o.skill,name=youOff?"You":B.foe.name.split(" ")[0];
 const atk=youOff?A.you:A.foe,dfd=youOff?A.foe:A.you;
 logLine((youOff?"You go to work — ":name+" attacks — ")+s.name+" vs "+DEFENSE[o.scheme].name+".","dim");
 await animApproach(atk,s.fam);
 // steal attempt
 if(o.scheme==="reach"&&!off.flow){
  const st=clamp(22+(def.stats.hnd-off.stats.hnd)*0.4,5,40);
  if(rnd()*100<st){sfx.steal();fx("🖐️ STOLEN!");
   await animSteal(dfd,atk);
   logLine(youOff?"Picked! "+name+" pays for the gamble... ball out.":"You strip "+name+" clean! 🔥");
   if(!youOff)bumpFlow("you");else bumpFlow("foe");
   await sleep(700);endPossession();return;}}
 // block attempt
 if(o.scheme==="jump"&&(s.fam==="drive"||s.fam==="post")&&!s.ignoreJump&&!off.flow){
  const bl=clamp(18+(def.stats.def-off.stats.fin)*0.4,5,35);
  if(rnd()*100<bl){sfx.miss();fx("🚫 REJECTED!");
   await animBlock(dfd,atk);
   logLine(youOff?"Sent back at the rim. Get that outta here!":"You meet "+name+" at the summit. DENIED. 🖐️");
   if(!youOff)bumpFlow("you");else bumpFlow("foe");
   await sleep(700);endPossession();return;}}
 // make %
 let p=s.base+(off.stats[s.stat]-50)*0.6-(def.stats.def-50)*0.35+MATCHUP[s.fam][o.scheme];
 if(off.sta<30)p-=12;
 if(youOff&&B.sauceLeft>0){p+=18;B.sauceLeft--;}
 if(def.flow)p-=25;
 p=clamp(p,15,92);
 if(off.flow)p=100;
 const made=rnd()*100<p;
 const ankle=off.flow&&s.fam==="drive";
 if(ankle){fx("💀 ANKLE BREAKER!");
  logLine(youOff?"You snatch souls — the defender is ON THE FLOOR.":name+"'s crossover drops you! Ankles = gone.");
  await animAnkle(dfd);await sleep(350);}
 const shotAnim=animShot(atk,made,off.flow);
 if(made){sfx.make();
  if(youOff){B.youPts+=s.pts;bumpFlow("you");}else{B.foePts+=s.pts;bumpFlow("foe");}}
 else{sfx.miss();
  if(youOff)bumpFlow("foe");else bumpFlow("you");}
 await shotAnim;
 if(made){fx(s.pts===3?"💦 SPLASH +3":"🏀 BUCKET +2");
  logLine(youOff?("Count it. +"+s.pts+(off.flow?" — FLOW.":"")):(name+" scores. +"+s.pts+(off.flow?" — he's in FLOW.":"")));}
 else{fx("🧱 CLANK");
  logLine(youOff?"Off the iron. Shake it off.":name+" misses — "+(o.scheme==="tight"?"that contest bothered it.":"board is yours."));}
 refreshBattleHud();await sleep(700);endPossession();}

function bumpFlow(side){if(B.freestyle)return;
 if(side==="you"&&B.youFlowT===0)B.youFlowM=clamp(B.youFlowM+1,0,6);
 if(side==="foe"&&B.foe.hasFlow&&B.foeFlowT===0)B.foeFlowM=clamp(B.foeFlowM+1,0,6);}

function endPossession(){fx("");
 G.sta=clamp(G.sta+5,0,G.stats.stamMax);B.foeSta=clamp(B.foeSta+5,0,B.foe.stats.stamMax);
 if(B.youFlowT>0)B.youFlowT--;if(B.foeFlowT>0)B.foeFlowT--;
 refreshBattleHud();
 if(B.youPts>=11||B.foePts>=11){endBattle();return;}
 B.yourBall=!B.yourBall;
 if(B.yourBall)offensePhase();else defensePhase();}

function defensePhase(){if(B.over)return;
 if(B.foe.hasFlow&&B.foeFlowM>=6&&B.foeFlowT===0){B.foeFlowM=0;B.foeFlowT=6;sfx.flow();fx("⚠️ "+B.foe.name.split(" ")[0]+" IS IN FLOW");
  logLine(B.foe.name+" gets that look in his eyes. Uh oh.");}
 refreshBattleHud();stanceOffense(false);
 const btns=Object.keys(DEFENSE).map(k=>({cls:"fam-def",
  html:DEFENSE[k].name+" <span class='sub'>"+DEFENSE[k].hint+"</span>",fn:()=>playerDefense(k)}));
 setActs("THEIR BALL — call your defense",btns);}
async function playerDefense(scheme){clearActs();
 const s=SKILLS[aiOffense()];B.foeSta=clamp(B.foeSta-s.sta,0,B.foe.stats.stamMax);
 await resolveShot({off:"foe",skill:s,scheme:scheme});}
function aiOffense(){const lo=B.foe.loadout;let best=lo[0],bestScore=-1;
 for(const id of lo){const s=SKILLS[id];if(B.foeSta<s.sta&&lo.some(o=>B.foeSta>=SKILLS[o].sta))continue;
  const sc=s.base+B.foe.stats[s.stat]*0.5+s.pts*4+rnd()*14;
  if(sc>bestScore){bestScore=sc;best=id;}}
 return best;}

async function endBattle(){B.over=true;clearActs();const won=B.youPts>=11;
 await sleep(400);
 if(won){fx("🏆 GAME.");logLine("FINAL: "+B.youPts+"–"+B.foePts+". That's game. 🏆");}
 else{fx("💀 GAME.");logLine("FINAL: "+B.foePts+"–"+B.youPts+". They point to the scoreboard.");}
 await sleep(1400);
 $("battle").classList.add("hidden");scene="world";
 const k=B.foeKey,foe=B.foe,first=!G.beaten[k];
 if(won){
  const post=[foe.win];
  if(first){G.beaten[k]=true;if(k!=="reign")G.wins++;
   for(const st of["hnd","sht","fin","def"])G.stats[st]+=2;G.stats.stamMax+=5;
   post.push("Your game leveled up! +2 all stats, +5 max stamina.");
   if(foe.teaches&&!G.skills.includes(foe.teaches)){G.skills.push(foe.teaches);autoEquip(foe.teaches);
    post.push("Learned: "+SKILLS[foe.teaches].name+"! ("+SKILLS[foe.teaches].desc+")");}
   if(foe.reward==="waterBottle"&&G.bag.length<bagCap()){G.bag.push("waterBottle");post.push("Got a Water Bottle! 🧴");}
   if(foe.reward==="dufflebag"){G.duffle=true;post.push("Got the DUFFLEBAG! 🎒 Bag capacity 3 → 6.");}
   if(k==="reign"){G.kingDown=true;
    post.push("👑 You took the crown of Your Block! CHAIN 1/8 earned.");
    post.push("Chapter 2 — Riverside Park — is where the vertical slice picks up. For now: rematches, freestyle, and style.");}
   if(G.wins===3&&!G.kingDown)post.push("The gym gate just unchained. King Reign is waiting. 👑");}
  showDialog(post,()=>save());
 }else{
  G.sta=Math.max(G.sta,30);
  showDialog([foe.lose,"You walk it off. Rest up at your crib or the fountain, tweak your loadout, run it back."],()=>save());}
}

/* ================= FREESTYLE ================= */
function startFreestyle(){scene="battle";
 Object.assign(B,{freestyle:true,style:0,attempts:8,mult:1,lastFam:null,over:false});
 $("battle").classList.remove("hidden");
 $("bThemName").textContent="ATTEMPTS";$("bThemLbl").textContent="—";
 $("bYouName")&&($("bYouName").textContent="STYLE");
 $("bMid").innerHTML="FREESTYLE<br>vary moves = combo";
 battleSceneInit(null);
 logClear();logLine("Empty court. Streetlight hum. Just you and the rock.","dim");
 refreshBattleHud();freestyleTurn();}
function freestyleTurn(){if(B.attempts<=0){endFreestyle();return;}
 refreshBattleHud();
 setActs("STYLE "+B.style+" · COMBO x"+B.mult.toFixed(1)+" · "+B.attempts+" attempts left",
  G.loadout.map(id=>skillBtn(id,()=>freestyleShot(id))).concat([{cls:"fam-def",html:"🚪 Wrap it up",fn:endFreestyle}]));}
async function freestyleShot(id){clearActs();const s=SKILLS[id];
 B.attempts--;G.sta=clamp(G.sta-s.sta,0,G.stats.stamMax);
 let p=clamp(s.base+(G.stats[s.stat]-50)*0.6+(G.sta<30?-12:0)+10,15,95);
 await animApproach(A.you,s.fam);
 const made=rnd()*100<p;
 await animShot(A.you,made,false);
 tw(A.you,{x:.24,y:.72,jy:0},350);
 if(made){sfx.make();
  if(B.lastFam&&B.lastFam!==s.fam)B.mult=Math.min(3,B.mult+0.5);else if(B.lastFam===s.fam)B.mult=1;
  const gain=Math.round(s.pts*10*B.mult);B.style+=gain;
  fx("✨ +"+gain);logLine(s.name+" — clean. +"+gain+" style (x"+B.mult.toFixed(1)+").");}
 else{sfx.miss();B.mult=1;fx("🧱");logLine("Bobbled it. Combo reset.","dim");}
 B.lastFam=s.fam;refreshBattleHud();await sleep(800);freestyleTurn();}
async function endFreestyle(){clearActs();fx("");
 logLine("Session over. STYLE: "+B.style+(B.style>G.freestyleBest?" — NEW BEST!":" (best "+G.freestyleBest+")"));
 G.freestyleBest=Math.max(G.freestyleBest,B.style);
 await sleep(1500);
 $("battle").classList.add("hidden");scene="world";
 const lines=[];
 if(G.freestyleBest>=200&&!G.sauceEarned){G.sauceEarned=true;
  if(G.bag.length<bagCap()){G.bag.push("specialSauce");lines.push("A hooded figure nods from the fence and tosses you... SPECIAL SAUCE. 🌶️");}
  else lines.push("A hooded figure wanted to gift you something — but your bag is full.");}
 if(lines.length)showDialog(lines,()=>save());else save();}

/* ================= MENU ================= */
function openMenu(){if(scene!=="world")return;scene="menu";const m=$("menu");m.classList.remove("hidden");
 const st=G.stats;
 m.innerHTML=
 "<h2>⛹🏾 YOUR GAME</h2>"+
 "<section><div class='statgrid'>"+
 "<span>Handles</span><b>"+st.hnd+"</b><span>Shooting</span><b>"+st.sht+"</b>"+
 "<span>Finishing</span><b>"+st.fin+"</b><span>Defense</span><b>"+st.def+"</b>"+
 "<span>Stamina</span><b>"+Math.round(G.sta)+"/"+st.stamMax+"</b><span>Park record</span><b>"+G.wins+"/3</b>"+
 "<span>Chains</span><b>"+(G.kingDown?"1":"0")+"/8</b><span>Freestyle best</span><b>"+G.freestyleBest+"</b>"+
 "</div></section>"+
 "<h2>🏀 SKILLS <span style='color:var(--chalk-dim);font-size:10px'>(tap to equip · max 4)</span></h2>"+
 "<section><div class='chips' id='mSkills'></div></section>"+
 "<h2>"+(G.duffle?"🎒 DUFFLEBAG":"🎒 BACKPACK")+" <span style='color:var(--chalk-dim);font-size:10px'>"+G.bag.length+"/"+bagCap()+" slots</span></h2>"+
 "<section id='mBag'>"+(G.bag.length?G.bag.map(i=>ITEMS[i].icon+" "+ITEMS[i].name+" — "+ITEMS[i].desc).join("<br>"):"Empty. Fountains refill water; freestyle finds the rare stuff.")+"</section>"+
 "<div class='row'><button id='mClose'>✓ Back to the block</button><button id='mReset' class='danger'>Reset save</button></div>";
 const chips=m.querySelector("#mSkills");
 for(const id of G.skills){const b=document.createElement("button");const s=SKILLS[id];
  b.textContent=s.name+" ("+s.fam+")";if(G.loadout.includes(id))b.classList.add("eq");
  b.onclick=()=>{sfx.blip();
   if(G.loadout.includes(id)){if(G.loadout.length>1)G.loadout=G.loadout.filter(x=>x!==id);}
   else if(G.loadout.length<4)G.loadout.push(id);
   b.classList.toggle("eq",G.loadout.includes(id));};
  chips.appendChild(b);}
 m.querySelector("#mClose").onclick=()=>{sfx.blip();save();m.classList.add("hidden");scene="world";};
 let armed=false;
 m.querySelector("#mReset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tap again to WIPE save";return;}
  localStorage.removeItem(SAVE_KEY);location.reload();};}

/* ================= INPUT ================= */
document.querySelectorAll(".dpad button[data-d]").forEach(b=>{
 const d=b.dataset.d;
 const down=e=>{e.preventDefault();held=d;};
 const up=e=>{e.preventDefault();if(held===d)held=null;};
 b.addEventListener("touchstart",down,{passive:false});b.addEventListener("touchend",up,{passive:false});
 b.addEventListener("mousedown",down);b.addEventListener("mouseup",up);b.addEventListener("mouseleave",up);});
const pressA=e=>{if(e)e.preventDefault();interact();};
$("btnA").addEventListener("touchstart",pressA,{passive:false});
$("btnA").addEventListener("mousedown",pressA);
$("dlg").addEventListener("click",()=>nextDialog());
$("menuBtn").addEventListener("click",openMenu);
window.addEventListener("keydown",e=>{
 const k=e.key;
 if(k==="ArrowUp"||k==="w")held="up";
 else if(k==="ArrowDown"||k==="s")held="down";
 else if(k==="ArrowLeft"||k==="a")held="left";
 else if(k==="ArrowRight"||k==="d")held="right";
 else if(k==="z"||k==="Enter"||k===" "){e.preventDefault();interact();}
 else if(k==="Escape"&&scene==="menu"){$("menu").classList.add("hidden");scene="world";}});
window.addEventListener("keyup",e=>{held=null;});

/* ================= BOOT ================= */
const existing=load();
if(existing){$("btnCont").classList.remove("hidden");}
$("btnNew").onclick=()=>{G=freshGame();boot();};
$("btnCont").onclick=()=>{G=existing||freshGame();boot();};
function boot(){sfx.blip();$("title").classList.add("hidden");scene="world";
 P.x=G.x+0.5;P.y=G.y+0.5;trail.length=0;trail.push({x:P.x,y:P.y});camSet=false;resize();save();
 if(!G.beaten.jaylen&&G.wins===0){
  showDialog(["Bounce: WOOF! 🐕","(Your dog Bounce is hyped. Tonight's the night.)",
   "Three ballers run the park court. Beat all 3 and the gym unchains —","— and King Reign is waiting inside. 👑",
   "Grab skill capsules 💿 you find around the block. Rest at your crib 🚪 or the fountain ⛲."]);}}
requestAnimationFrame(draw);
</script>
