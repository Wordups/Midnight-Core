name: keepalive

# Free-tier Render spins down after idle (first visitor then waits ~50s) and
# free-tier Supabase pauses after prolonged inactivity. Pinging every 10
# minutes keeps the demo warm so a first visit never reads as broken.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://midnight-core-cod3.onrender.com/health)
          echo "health: $code"
          test "$code" = "200"
      - name: Touch landing page
        run: curl -s -o /dev/null --max-time 90 -L https://midnight-core-cod3.onrender.com/
